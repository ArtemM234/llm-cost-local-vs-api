[project]
name = "llmcost"
version = "0.1.0"
description = "Cost per correctly solved task: local LLMs on a laptop vs Claude API"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.12.0",
    "ollama==0.6.3",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
llmcost = "llmcost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
