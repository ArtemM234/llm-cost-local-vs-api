# Общие параметры прогона: одинаковы для всех моделей (пункт 4 куратора).
[run]
max_tokens = 4096        # общий лимит выходных токенов
seed = 42                # только для Ollama; Claude API seed не принимает
api_concurrency = 4      # параллельные запросы к API; локальная модель всегда строго по одной задаче
code_timeout_s = 60      # нужен только для HumanEval+ (сейчас не используется)
idle_seconds = 30        # замер мощности в простое перед локальным прогоном

[hardware]
name = "Домашний ПК: AMD Ryzen 7 5700X3D, NVIDIA GeForce RTX 4070, 32 GB RAM"
memory_gb = 12               # видеопамять RTX 4070: в ней лежат веса модели
memory_bandwidth_gbs = 504   # RTX 4070: GDDR6X, 192 бит × 21 Гбит/с = 504 ГБ/с

[economics]
# Цена ПК для сценария «покупка под задачу» — допущение статьи; чувствительность к ней см. на рис. 3.
# Основной сценарий — «компьютер уже есть»: там цена оборудования не нужна.
laptop_price_usd = 2000.0
lifetimes_years = [3, 4, 5]
electricity_usd_per_kwh = [0.10, 0.20, 0.35]   # базовый сценарий — средний элемент
wear_usd_per_hour = 0.0

# --- Модели: у всех рассуждения выключены -------------------------------------
# Claude 5.5: temperature НЕ передаётся — API отклоняет нестандартные значения (400).
# Выключение рассуждений: Haiku 5.5 — "disabled", Sonnet 5.5 — "between_tools".
# Fallback на другую модель при отказе специально НЕ включён: ответ другой модели испортил бы замер.

[[models]]
name = "haiku-5.5"
backend = "anthropic"
model = "claude-haiku-5-5"
thinking = "disabled"
effort = "medium"

[[models]]
name = "sonnet-5.5"
backend = "anthropic"
model = "claude-sonnet-5-5"
thinking = "between_tools"
effort = "medium"

[[models]]
name = "qwen3-8b"
backend = "ollama"
model = "qwen3:8b"
think = false
num_ctx = 8192
